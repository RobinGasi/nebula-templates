schemaVersion: 1
name: Wallabag
description: Self-hosted read-it-later app — save articles from anywhere and read them offline, ad-free and tracker-free.
category: productivity
tags: [read-it-later, bookmarks]
links:
  website: https://wallabag.org
  docs: https://doc.wallabag.org
  source: https://github.com/wallabag/wallabag
readme: |
  ## First login

  1. Open the hostname you set below once the deployment is healthy.
  2. Sign in with the default account `wallabag` / `wallabag`, then change the password immediately under Config → your profile.
  3. Install the [browser extension or mobile app](https://doc.wallabag.org/en/user/) and point it at this hostname to start saving articles.
inputs:
  - key: HOSTNAME
    label: Hostname
    description: Where Wallabag is served, for example read.example.com. Leave empty to add a domain later.
  - key: EXPOSURE
    label: Exposure
    description: Public serves the hostname on the internet; tailnet serves it only inside your Tailscale network.
    default: public
    options: [public, tailnet]
services:
  - name: wallabag
    image: docker.io/wallabag/wallabag:2.6.14
    processes:
      - name: web
        kind: http
        port: 80
        # nginx and php-fpm run under one supervisor that needs root to
        # start and bind port 80; the official image ships no
        # unprivileged variant.
        runAsUser: 0
        memory: {request: 128Mi, limit: 512Mi}
        cpu: {request: 50m, limit: 500m}
        volumes:
          - name: data
            mountPath: /var/www/wallabag/data
            size: 1Gi
          - name: images
            mountPath: /var/www/wallabag/web/assets/images
            size: 2Gi
        domain:
          hostname: ${{ inputs.HOSTNAME }}
          exposure: ${{ inputs.EXPOSURE }}
    variables:
      SYMFONY__ENV__DATABASE_DRIVER: pdo_pgsql
      SYMFONY__ENV__DATABASE_HOST: ${{ host(db) }}
      SYMFONY__ENV__DATABASE_PORT: "5432"
      SYMFONY__ENV__DATABASE_NAME: app
      SYMFONY__ENV__DATABASE_USER: postgres
      SYMFONY__ENV__DATABASE_PASSWORD: ${{ db.POSTGRES_PASSWORD }}
      SYMFONY__ENV__DOMAIN_NAME: https://${{ inputs.HOSTNAME }}
      SYMFONY__ENV__SECRET: ${{ secret(32) }}
  - name: db
    database: {engine: postgres}
